name: record

# Records what the Codex of the moment sends in the first request of a session, on each system (src/recorded.mjs keeps the figures that differ
# from one system to another: the tool definitions, the permissions block and the environment block). Run it by hand when a new Codex comes
# out, then download the three files, read the diff and copy each system's entry into src/recorded.mjs. It costs nothing: Codex talks to a
# fake Responses API on 127.0.0.1.
on:
  workflow_dispatch:
    inputs:
      codex_version:
        description: "Version of @openai/codex to install (default: the newest)"
        required: false
        default: "latest"

jobs:
  record:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @openai/codex@${{ inputs.codex_version || 'latest' }}
      - run: codex --version
      - name: Record the first request
        run: node test/record-oracles.mjs recorded
        env:
          E2E_CODEX: codex
      - uses: actions/upload-artifact@v4
        with:
          name: recorded-${{ matrix.os }}
          path: src/recorded.mjs
